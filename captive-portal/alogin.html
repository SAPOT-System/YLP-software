<!DOCTYPE html>
<html>

    <head>

        <meta charset="utf-8">

        <meta http-equiv="refresh"
              content="2; url=$(link-redirect)">

        <title>

            Authorizing Access

        </title>

        <style>

         body{

             font-family:Inter;

             display:flex;

             justify-content:center;

             align-items:center;

             height:100vh;

             background:#f6f5f0;

             margin:0;

         }

         .card{

             background:white;

             padding:42px;

             border-radius:22px;

             text-align:center;

         }

         .spinner{

             width:36px;

             height:36px;

             border:3px solid #ddd;

             border-top:3px solid #1a3cff;

             border-radius:50%;

             margin:auto;

             animation:spin .7s linear infinite;

         }

         @keyframes spin{

             to{

                 transform:rotate(360deg)

             }

         }

        </style>

        <script>

         function startClock(){

             $(if popup == 'true')

             open(
                 '$(link-status)',
                 'hotspot_status',
                 'width=350,height=250'
             );

             $(endif)

             location.href=
                 unescape("http://192.168.0.1/status");

         }

        </script>

    </head>

    <body onload="startClock()">

        <div class="card">

            <div class="spinner"></div>

            <h2>

                Authorizing Access

            </h2>

            <p>
                Preparing your network session.
            </p>

        </div>

    </body>

</html>
