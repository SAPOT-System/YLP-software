<!DOCTYPE html>
<html>

    <head>

        <meta charset="utf-8">

        <meta name="viewport"
              content="width=device-width,initial-scale=1">

        <title>
            SAPOT Network — Error
        </title>

        <style>

         body{

             font-family:Inter;

             background:#f6f5f0;

             display:flex;

             justify-content:center;

             align-items:center;

             height:100vh;

             margin:0;

         }

         .card{

             width:430px;

             background:white;

             padding:36px;

             border-radius:22px;

             text-align:center;

         }

         .error{

             background:#fef2f2;

             padding:14px;

             border-radius:12px;

             margin:22px 0;

             color:#b91c1c;

         }

         a{

             display:inline-block;

             padding:14px 22px;

             background:#111827;

             color:white;

             border-radius:12px;

             text-decoration:none;

         }

        </style>

    </head>

    <body>

        <div class="card">

            <h1>
                Connection Problem
            </h1>

            <p>

                Unable to complete your network request.

            </p>

            <div class="error">

                $(error)

            </div>

            <a href="$(link-login)">

                Return To Sign In

            </a>

        </div>

    </body>

</html>
