<!DOCTYPE html>
<html>
    <head>

        <meta charset="utf-8">

        <meta name="viewport"
              content="width=device-width,initial-scale=1">

        <title>
            SAPOT Network — Session Ended
        </title>

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

        <style>

         body{

             font-family:Inter;

             background:#f6f5f0;

             display:flex;

             justify-content:center;

             align-items:center;

             height:100vh;

             margin:0;

         }

         .card{

             width:420px;

             background:white;

             padding:42px;

             border-radius:24px;

             box-shadow:0 8px 40px rgba(0,0,0,.08);

             text-align:center;

         }

         h1{

             font-size:30px;

             margin-bottom:12px;

         }

         p{

             color:#6b7280;

             line-height:1.7;

             margin-bottom:28px;

         }

         a{

             display:block;

             padding:14px;

             background:#111827;

             color:white;

             text-decoration:none;

             border-radius:12px;

             font-weight:700;

         }

         small{

             display:block;

             margin-top:24px;

             color:#9ca3af;

         }

        </style>

    </head>

    <body>

        <div class="card">

            <h1>
                Session Ended
            </h1>

            <p>

                Your device has been disconnected successfully.

            </p>

            <a href="$(link-login)">
                Reconnect
            </a>

            <small>

                SAPOT Network Gateway

            </small>

        </div>

    </body>

</html>
