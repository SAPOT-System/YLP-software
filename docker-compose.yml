services:
  db:
    image: mariadb:11
    restart: unless-stopped
    # env_file, not `environment: ${VAR}` substitution — the MYSQL_* values
    # live in server/.env (shared with the api service), and Compose only
    # auto-loads a top-level .env for substitution, which doesn't exist at
    # the repo root. Reading them as real container env vars here works
    # regardless of how `docker compose` is invoked (with or without
    # docker/up.sh's --env-file flag).
    env_file:
      - ./server/.env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  certgen:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    environment:
      CERT_CN: ${CERT_CN:-localhost}
      CERT_SAN: ${CERT_SAN:-DNS:localhost,IP:127.0.0.1}
      CA_DIR: /dev-ca
    volumes:
      - ./docker/gen-certs.sh:/gen-certs.sh:ro
      - ./server/certs:/certs
      - ${DEV_CA_DIR:-./server/dev-ca}:/dev-ca:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/certs:/certs:ro
      - ./server/static:/usr/share/nginx/static:ro

  admin:
    build:
      context: ./admin-frontend/sapot-admin
    command: pnpm dev
    restart: unless-stopped
    env_file:
      - ./admin-frontend/sapot-admin/.env
    environment:
      # Server-side only (Next.js route handlers/server actions run inside
      # this container) — safe to use the compose service DNS name.
      # NEXT_PUBLIC_* vars are NOT overridden here: they get baked into the
      # client bundle and run in the developer's own browser on the host
      # network, which can't resolve "nginx" — those keep whatever
      # host-reachable value is set in this service's .env (LAN IP/localhost).
      API_DOMAIN: https://nginx
    volumes:
      - ./admin-frontend/sapot-admin:/app
      - /app/node_modules
      - /app/.next
      - ./server/certs:/app/certs:ro
    depends_on:
      nginx:
        condition: service_started
    ports:
      - "3000:3000"

  tileserver:
    image: maptiler/tileserver-gl
    restart: unless-stopped
    command: ["--mbtiles", "osm-2020-02-10-v3.11_asia_philippines.mbtiles"]
    volumes:
      - ./tileserver:/data
    ports:
      - "8080:8080"

  gsm-fastapi:
    build:
      context: ./GSM-module/GSM-fastapi
    restart: unless-stopped
    env_file:
      - ./GSM-module/GSM-fastapi/.env
    environment:
      HOST: 0.0.0.0
      SAPOT_API_URL: https://nginx
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  db-data:
