services:
  db:
    image: mariadb:11
    restart: unless-stopped
    # env_file, not `environment: ${VAR}` substitution — the MYSQL_* values
    # live in server/.env (shared with the api service), and Compose only
    # auto-loads a top-level .env for substitution, which doesn't exist at
    # the repo root. Reading them as real container env vars here works
    # regardless of how `docker compose` is invoked (with or without
    # docker/up.sh's --env-file flag).
    env_file:
      - ./server/.env
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  certgen:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "/gen-certs.sh"]
    environment:
      CERT_CN: ${CERT_CN:-localhost}
      CERT_SAN: ${CERT_SAN:-DNS:localhost,IP:127.0.0.1},DNS:nginx
      CA_DIR: /dev-ca
    volumes:
      - ./docker/gen-certs.sh:/gen-certs.sh:ro
      - ./server/certs:/certs
      - ${DEV_CA_DIR:-./server/dev-ca}:/dev-ca:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
      api:
        condition: service_started
      tileserver:
        condition: service_started
    ports:
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/certs:/certs:ro
      - ./server/static:/usr/share/nginx/static:ro

  admin:
    build:
      context: ./admin-frontend/sapot-admin
    command: pnpm dev
    restart: unless-stopped
    env_file:
      - ./admin-frontend/sapot-admin/.env
    environment:
      # Server-side only (Next.js route handlers/server actions run inside
      # this container) — safe to use the compose service DNS name.
      # NEXT_PUBLIC_* vars are NOT overridden here: they get baked into the
      # client bundle and run in the developer's own browser on the host
      # network, which can't resolve "nginx" — those keep whatever
      # host-reachable value is set in this service's .env (LAN IP/localhost).
      API_DOMAIN: https://nginx
      NODE_EXTRA_CA_CERTS: /app/certs/server_ca.pem
    volumes:
      - ./admin-frontend/sapot-admin:/app
      - /app/node_modules
      - /app/.next
      # Only the public CA is needed by Node. Do not mount the backend leaf
      # certificate or private key into the admin container.
      - ${DEV_CA_DIR:-./server/dev-ca}/server_ca.pem:/app/certs/server_ca.pem:ro
    depends_on:
      nginx:
        condition: service_started
    ports:
      - "${ADMIN_PORT:-3000}:3000"

  tileserver:
    image: maptiler/tileserver-gl
    restart: unless-stopped
    command: ["--mbtiles", "osm-batangas.mbtiles"]
    volumes:
      - ./tileserver:/data
    # Not published to the host — only reachable via nginx (TLS) at /tiles/,
    # same pattern as the api service (see nginx.docker.conf).
    expose:
      - "8080"

  gsm-fastapi:
    build:
      context: ./GSM-module/GSM-fastapi
    restart: unless-stopped
    env_file:
      - ./GSM-module/GSM-fastapi/.env
    environment:
      HOST: 0.0.0.0
      SAPOT_API_URL: https://nginx
    # No /dev/ttyACM0 device passthrough here — the modem isn't present on
    # most dev machines, and Compose has no "optional device" syntax, so
    # declaring it here would abort the whole `docker compose up` (nginx/
    # admin left stuck in "Created") whenever the hardware is missing. Add
    # docker-compose.gsm-hardware.yml explicitly when the modem is attached:
    # docker/up.sh -f docker-compose.yml -f docker-compose.gsm-hardware.yml up -d
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GSM_FASTAPI_PORT:-8001}:8001"

volumes:
  db-data:
