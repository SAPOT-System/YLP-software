# nginx reverse proxy for YLP / SAPOT server
# Install: sudo apt install nginx
# Deploy:  sudo cp nginx.conf /etc/nginx/sites-available/ylp
#          sudo ln -s /etc/nginx/sites-available/ylp /etc/nginx/sites-enabled/ylp
#          sudo nginx -t && sudo systemctl reload nginx
# Also change runserver.sh to bind on 127.0.0.1:8000 (remove TLS flags from gunicorn).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /home/adamskieee/server.crt;
    ssl_certificate_key /home/adamskieee/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve profile pictures directly — never touches Python workers
    location /static/ {
        alias /home/adamskieee/Documents/dev/YLP-software/server/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket — long-lived connection, no proxy read timeout
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API — gzip JSON, buffer slow clients
    location / {
        #  These are required — nginx strips these by default
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        proxy_pass          http://127.0.0.1:8000;
        proxy_set_header    Host            $host;
        proxy_read_timeout  135s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # proxy_set_header    X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ← tells backend it's HTTPS
        proxy_set_header Authorization     $http_authorization;

        # ← rewrites any http:// redirects from backend to https://
        proxy_redirect http:// https://;

        gzip            on;
        gzip_types      application/json text/plain;
        gzip_min_length 256;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}
