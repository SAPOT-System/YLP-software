# Auto-loaded by `docker compose` alongside docker-compose.yml for local
# dev: bind-mounts the app source for live edits and swaps gunicorn for a
# single reloading uvicorn worker. Not used in CI (`docker compose run --rm
# api pytest` doesn't need this file) — omit it in prod-parity checks with
# `docker compose -f docker-compose.yml ...`.
services:
  api:
    volumes:
      - ./app:/home/app/server/app
      - ${FIREBASE_ADMIN_CREDENTIALS_HOST_PATH}:${FIREBASE_ADMIN_CREDENTIALS_PATH}:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
