# Production-only compose file. build-bundle.sh ships this as compose/docker-compose.yml.
# It intentionally has no build directives, bind mounts of source code, or certgen service.
services:
  db:
    image: sapot/mariadb:bundle
    restart: unless-stopped
    env_file: [../../../shared/server.env]
    volumes: [../../../shared/db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: sapot/redis:bundle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: sapot/api:bundle
    restart: unless-stopped
    env_file: [../../../shared/server.env]
    environment:
      SAPOT_LOG_DIR: /home/app/logs
    volumes:
      - ../../../shared/logs/api:/home/app/logs
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/version')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
  nginx:
    image: sapot/nginx:bundle
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}
      tileserver: {condition: service_started}
      admin: {condition: service_started}
    ports: ["80:80", "443:443"]
    volumes:
      - ../config/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../shared/certs:/certs:ro
      - ../data/static:/usr/share/nginx/static:ro
      - ../config/status.html:/usr/share/nginx/status/status.html:ro
      - ../../../shared/status:/usr/share/nginx/state:ro
  admin:
    image: sapot/admin:bundle
    restart: unless-stopped
    env_file: [../../../shared/admin.env]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  tileserver:
    image: sapot/tileserver-gl:bundle
    restart: unless-stopped
    command: ["--mbtiles", "osm-batangas.mbtiles"]
    volumes: [../data:/data]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', r => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 12
  gsm-fastapi:
    image: sapot/gsm-fastapi:bundle
    restart: unless-stopped
    env_file: [../../../shared/gsm-fastapi.env]
    environment:
      HOST: 0.0.0.0
      SAPOT_API_URL: https://nginx
      GSM_LOG_DIR: /var/log/sapot
    volumes:
      - ../../../shared/logs/gsm:/var/log/sapot
    depends_on:
      db: {condition: service_healthy}
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
  # This service intentionally has no dependencies and is not depended on.
  # It must continue producing a diagnostic snapshot when peers are down.
  status-collector:
    image: sapot/api:bundle
    restart: unless-stopped
    env_file: [../../../shared/status.env]
    entrypoint: ["python", "/opt/sapot/collect-status.py"]
    volumes:
      - ../scripts/collect-status.py:/opt/sapot/collect-status.py:ro
      - ../../../shared/status:/status
      - ../../../shared/certs:/certs:ro
