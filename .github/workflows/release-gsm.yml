name: Release GSM Module
on:
  push:
    tags: ["gsm/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#gsm/v}" >> "$GITHUB_ENV"
      - name: Assert source versions match tag
        run: |
          APP_SRC=$(grep -oP '__version__\s*=\s*"\K[^"]+' GSM-module/GSM-fastapi/app_version.py)
          if [ "$APP_SRC" != "$VERSION" ]; then
            echo "GSM-fastapi/app_version.py ($APP_SRC) != tag ($VERSION). Run ./scripts/release.sh before tagging." >&2
            exit 1
          fi
          FW_SRC=$(grep -oP '#define FIRMWARE_VERSION\s+"\K[^"]+' GSM-module/GSM-arduino-actual-code/GSM-arduino-actual-code.ino)
          if [ "$FW_SRC" != "$VERSION" ]; then
            echo "GSM-arduino-actual-code.ino FIRMWARE_VERSION ($FW_SRC) != tag ($VERSION). Run ./scripts/release.sh before tagging." >&2
            exit 1
          fi
      - name: Generate release notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            scripts/generate_release_notes.sh "$GITHUB_REF_NAME" notes.md
          else
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          fi
          [ -s notes.md ] || { echo "notes.md is empty — is '$GITHUB_REF_NAME' an annotated tag?" >&2; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
