name: Expo Android CI/CD

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: mobile-app/sapot-mobile-app

      - name: Lint
        run: npm run lint
        working-directory: mobile-app/sapot-mobile-app

      - name: Typecheck
        run: npm run typecheck --if-present
        working-directory: mobile-app/sapot-mobile-app

      - name: Unit tests
        run: npm test -- --runInBand --forceExit
        if: hashFiles('**/*.test.*') != ''
        working-directory: mobile-app/sapot-mobile-app

      - name: Expo Doctor
        run: npx expo-doctor
        working-directory: mobile-app/sapot-mobile-app