name: Expo Android CI/CD

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mobile-app/sapot-mobile-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile-app/sapot-mobile-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: mobile-app/sapot-mobile-app

      - name: Lint
        run: pnpm run lint
        working-directory: mobile-app/sapot-mobile-app

      - name: Typecheck
        run: pnpm run typecheck --if-present
        working-directory: mobile-app/sapot-mobile-app

      - name: Unit tests
        run: pnpm test -- --runInBand --forceExit
        if: hashFiles('**/*.test.*') != ''
        working-directory: mobile-app/sapot-mobile-app

      - name: Expo Doctor
        run: pnpm exec expo-doctor
        working-directory: mobile-app/sapot-mobile-app