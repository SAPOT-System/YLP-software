name: Expo Android CI/CD

on:
  pull_request:
    branches: [develop]

  push:
    branches: [develop]
    tags:
      - "v*"

jobs:
  # -------------------------
  # 1. PR QUALITY GATE
  # -------------------------
  pr-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test -- --runInBand
        if: hashFiles('**/*.test.*') != ''  

      - name: Expo Doctor
        run: npx expo-doctor

  # -------------------------
  # 2. DEVELOPMENT BUILD
  # -------------------------
  dev-build:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: pr-checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - run: npm install -g eas-cli

      - name: Login to Expo
        run: eas login --token ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Dev Client
        run: eas build --platform android --profile development --non-interactive

  # -------------------------
  # 3. PRODUCTION BUILD
  # -------------------------
  production-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - run: npm install -g eas-cli

      - name: Login to Expo
        run: eas login --token ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Production
        run: eas build --platform android --profile production --non-interactive