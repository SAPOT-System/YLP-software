name: Debug Secret
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: bundle-release
    steps:
      - name: Check Secret
        env:
          KEY: ${{ secrets.BUNDLE_RELEASE_POLICY_PRIVATE_KEY }}
        run: |
          echo "Length: ${#KEY}"
          if [[ "$KEY" == *"BEGIN RSA PRIVATE KEY"* ]]; then
            echo "Contains BEGIN RSA PRIVATE KEY"
          elif [[ "$KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            echo "Contains BEGIN PRIVATE KEY"
          else
            echo "Does NOT contain BEGIN PRIVATE KEY header"
          fi
          
          if [[ "$KEY" == *'\n'* ]]; then
            echo "Contains literal \\n characters"
          fi
          
          if [[ "$KEY" == *$'\n'* ]]; then
            echo "Contains actual newlines"
          else
            echo "Does NOT contain actual newlines"
          fi
          
          if echo "$KEY" | base64 -d >/dev/null 2>&1; then
            echo "Is valid base64"
          else
            echo "Is NOT valid base64"
          fi
