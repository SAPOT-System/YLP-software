name: Release Admin Frontend
on:
  push:
    tags: ["admin/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#admin/v}" >> "$GITHUB_ENV"
      - name: Assert source version matches tag
        run: |
          SRC=$(jq -r .version admin-frontend/sapot-admin/package.json)
          if [ "$SRC" != "$VERSION" ]; then
            echo "admin-frontend/sapot-admin/package.json ($SRC) != tag ($VERSION). Run ./scripts/release.sh before tagging." >&2
            exit 1
          fi
      - name: Extract notes from the annotated tag
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || { echo "notes.md is empty — is '$GITHUB_REF_NAME' an annotated tag?" >&2; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
