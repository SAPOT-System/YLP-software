name: Release Server
on:
  push:
    tags: ["server/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#server/v}" >> "$GITHUB_ENV"
      - name: Assert source version matches tag
        run: |
          SRC=$(grep -oP '__version__\s*=\s*"\K[^"]+' server/app/version.py)
          if [ "$SRC" != "$VERSION" ]; then
            echo "app/version.py ($SRC) != tag ($VERSION). Run ./scripts/release.sh before tagging." >&2
            exit 1
          fi
      - name: Extract notes from the annotated tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
