name: EAS Preview Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: develop

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.6
          cache: npm
          cache-dependency-path: mobile-app/sapot-mobile-app/package-lock.json

      - run: npm ci
        working-directory: mobile-app/sapot-mobile-app

      - run: npx expo prebuild --no-install || true
        working-directory: mobile-app/sapot-mobile-app

      - run: npx eas build --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        working-directory: mobile-app/sapot-mobile-app
