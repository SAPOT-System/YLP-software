name: Release Captive Portal
on:
  push:
    tags: ["portal/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#portal/v}" >> "$GITHUB_ENV"
      - name: Assert source version matches tag
        run: |
          SRC=$(cat captive-portal/VERSION)
          if [ "$SRC" != "$VERSION" ]; then
            echo "captive-portal/VERSION ($SRC) != tag ($VERSION). Run ./scripts/release.sh before tagging." >&2
            exit 1
          fi
      - name: Generate release notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            scripts/generate_release_notes.sh "$GITHUB_REF_NAME" notes.md
          else
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          fi
          [ -s notes.md ] || { echo "notes.md is empty — is '$GITHUB_REF_NAME' an annotated tag?" >&2; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
