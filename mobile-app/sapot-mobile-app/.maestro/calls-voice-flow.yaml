appId: com.devamt.sapotmobileapp.dev
name: "Calls - Voice call: start -> accept -> active -> end"
tags:
  - calls
  - e2e
---
# Run this flow on the INITIATOR device. On the PEER device, manually tap
# "Accept" on the incoming call screen while this flow is waiting - see
# docs/TESTING.md for the two-simulator setup.
- launchApp:
    clearState: false
    permissions:
      microphone: allow
      camera: allow
      notifications: allow

- tapOn: "Chats"
- tapOn:
    id: "voice-call-button"

- assertVisible: "Calling..."

# On the peer device the incoming call screen shows "Incoming call..." with
# an "Accept" button - accept there, then continue here.
- extendedWaitUntil:
    visible:
      id: "end-call-button"
    timeout: 30000

- assertVisible: "End Call"

- tapOn:
    id: "end-call-button"

- assertVisible: "Call ended"
