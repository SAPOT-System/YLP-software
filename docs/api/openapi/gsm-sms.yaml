  /gsm/inbound:
    post:
      tags:
      - gsm
      summary: Inbound Sms
      description: 'Internal endpoint: receives an inbound SMS from the GSM-API and delivers it to the target user via WebSocket.'
      operationId: inbound_sms_gsm_inbound_post
      requestBody:
        content:
          application/json:
            schema:
