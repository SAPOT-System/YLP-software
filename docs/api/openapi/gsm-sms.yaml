components:
  schemas:
    GsmFailureDetail:
      properties:
        message:
          type: string
          title: Message
        reason:
          type: string
          title: Reason
        msg_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Msg Id
      type: object
      required:
      - message
      - reason
      title: GsmFailureDetail
    GsmFailureResponse:
      properties:
        detail:
          $ref: '#/components/schemas/GsmFailureDetail'
      type: object
      required:
      - detail
      title: GsmFailureResponse
    GsmHealthResponse:
      properties:
        status:
          type: string
          title: Status
        gsm_ready:
          type: boolean
          title: Gsm Ready
        connected:
          type: boolean
          title: Connected
        detail:
          type: string
          title: Detail
      type: object
      required:
      - status
      - gsm_ready
      - connected
      - detail
      title: GsmHealthResponse
    GsmHealthUnavailableResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: GsmHealthUnavailableResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InboundSMSPayload:
      properties:
        sender_phone:
          type: string
          title: Sender Phone
        target_phone:
          type: string
          title: Target Phone
        body:
          type: string
          title: Body
      type: object
      required:
      - sender_phone
      - target_phone
      - body
      title: InboundSMSPayload
    RequestPhoneVerification:
      properties:
        phone_number:
          type: string
          title: Phone Number
      type: object
      required:
      - phone_number
      title: RequestPhoneVerification
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyPhoneCode:
      properties:
        code:
          type: string
          title: Code
      type: object
      required:
      - code
      title: VerifyPhoneCode
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: auth/token
