openapi: 3.1.0
info:
  title: SAPOT Server — System
  version: 0.0.2-beta.1
paths:
  /:
    get:
      summary: Read Root
      operationId: read_root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /download/download-apk:
    get:
      tags:
      - download
      summary: Download Apk
      operationId: download_apk_download_download_apk_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
  /ping:
    get:
      tags:
      - ping
      - connectivity test
      summary: Ping Testing
      operationId: ping_testing_ping_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
      security:
      - OAuth2PasswordBearer: []
  /testing/test-make-admin:
    post:
      tags:
      - testing endpoint
      summary: Make User Admin
      operationId: make_user_admin_testing_test_make_admin_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /testing/test-make-rescuer:
    post:
      tags:
      - testing endpoint
      summary: Make User Rescuer
      operationId: make_user_rescuer_testing_test_make_rescuer_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: query
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /update/profile/:
    post:
      tags:
      - update
      - profile
      summary: Update User
      operationId: update_user_update_profile__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /user-utils/current-user-info:
    get:
      tags:
      - user utils
      summary: Get Current User Info
      operationId: get_current_user_info_user_utils_current_user_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '404':
          description: Not Found
      security:
      - OAuth2PasswordBearer: []
  /user-utils/get-announcements:
    get:
      tags:
      - user utils
      summary: Get My Announcements
      operationId: get_my_announcements_user_utils_get_announcements_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user-utils/is-admin:
    get:
      tags:
      - user utils
      summary: Is Admin
      operationId: is_admin_user_utils_is_admin_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
      security:
      - OAuth2PasswordBearer: []
  /user-utils/is-rescuer:
    get:
      tags:
      - user utils
      summary: Is Rescuer
      operationId: is_rescuer_user_utils_is_rescuer_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
      security:
      - OAuth2PasswordBearer: []
  /user-utils/search-user:
    post:
      tags:
      - user utils
      summary: Search User
      operationId: search_user_user_utils_search_user_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: identifier_string
        in: query
        required: true
        schema:
          type: string
          title: Identifier String
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user-utils/search-user/{id}:
    get:
      tags:
      - user utils
      summary: Search User By Id
      operationId: search_user_by_id_user_utils_search_user__id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /version:
    get:
      summary: Get Version
      operationId: get_version_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UserInfo:
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 2
          title: Username
        first_name:
          type: string
          maxLength: 50
          minLength: 2
          title: First Name
        last_name:
          type: string
          maxLength: 50
          minLength: 2
          title: Last Name
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        id:
          type: string
          format: uuid
          title: Id
        email_verified:
          type: boolean
          title: Email Verified
        phone_verified:
          type: boolean
          title: Phone Verified
        role:
          type: string
          title: Role
      type: object
      required:
      - username
      - first_name
      - last_name
      - id
      - email_verified
      - phone_verified
      - role
      title: UserInfo
    UserUpdate:
      properties:
        username:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 2
          - type: 'null'
          title: Username
        first_name:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 2
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 2
          - type: 'null'
          title: Last Name
        phone_number:
          anyOf:
          - type: string
            pattern: ^\+639\d{9}$
          - type: 'null'
          title: Phone Number
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
      type: object
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: auth/token
