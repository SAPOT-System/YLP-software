openapi: 3.1.0
info:
  title: SAPOT Server — Admin
  version: 0.0.2-beta.1
paths:
  /admin:
    get:
      tags:
      - admin
      summary: Test If Admin
      operationId: test_if_admin_admin_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
      security:
      - OAuth2PasswordBearer: []
  /admin/announcements/{announcement_id}:
    patch:
      tags:
      - admin
      summary: Edit Announcement
      operationId: edit_announcement_admin_announcements__announcement_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: announcement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Announcement Id
      - name: title
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      - name: content
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
      - name: priority
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PriorityType'
          - type: 'null'
          title: Priority
      - name: target_audience
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AudienceType'
          - type: 'null'
          title: Target Audience
      - name: expires_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AnnouncementStatusType'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - admin
      summary: Delete Announcement
      operationId: delete_announcement_admin_announcements__announcement_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: announcement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Announcement Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/ban/user:
