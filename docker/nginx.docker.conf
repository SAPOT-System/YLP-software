# nginx reverse proxy for the Dockerized YLP / SAPOT server.
# Docker-flavored copy of nginx.conf: proxies to the `api` service by
# Docker DNS name instead of 127.0.0.1, and reads certs from the shared
# `certs` volume mounted into this container. The host nginx.conf (used
# for bare-metal deploys) is untouched — update both if the proxy rules
# change.

# Only sets "Connection: upgrade" when the client actually requested a
# protocol upgrade (WebSocket); otherwise falls through to nginx's default
# keep-alive behavior instead of forcing every plain HTTP request to close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve profile pictures directly — never touches Python workers
    location /static/ {
        alias /usr/share/nginx/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Tileserver — reverse-proxied so tile requests share the API's TLS
    # cert/pinning instead of exposing tileserver-gl's own port 8080.
    # Trailing slash on proxy_pass strips the /tiles/ prefix.
    location /tiles/ {
        proxy_pass          http://tileserver:8080/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;   # ← tells tileserver-gl it's HTTPS, so embedded tile/sprite/glyph URLs in style.json aren't emitted as http:// (sent once — tileserver-gl's proto check fails a strict 'https' match if this header is duplicated)
        proxy_set_header    X-Forwarded-Path /tiles;     # ← proxy_pass above strips the /tiles/ prefix; without this, tileserver-gl's self-referential URLs (data/glyphs/sprite) omit it too and 404

        gzip            on;
        gzip_types      application/json;
        gzip_min_length 256;
    }

    # TileServer GL emits absolute /data/, /fonts/, and /sprites/ URLs in
    # style documents. Preserve those paths when proxying them to TileServer.
    location ~ ^/(data|fonts|sprites)/ {
        proxy_pass          http://tileserver:8080;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin dashboard (Next.js). No trailing slash on the location: Next's
    # basePath: "/admin" canonicalizes to no trailing slash and 308-redirects
    # /admin/ -> /admin, which needs to hit this same block, not fall through
    # to the API catch-all below (see 67a5fc8c8).
    #
    # WebSocket upgrade headers are required here (not just under /ws/):
    # Next's dev server (`next dev`) opens a WebSocket at
    # /admin/_next/webpack-hmr for HMR, and without proxy_http_version 1.1 +
    # Upgrade/Connection headers, nginx proxies that handshake as a plain
    # HTTP request. The handshake then fails, which leaves the client bundle
    # unhydrated — every page under /admin renders as static HTML with no
    # React event handlers attached, so forms silently fall back to native
    # browser submission (GET, credentials in the URL) instead of calling
    # the app's fetch-based handlers. This only reproduces through nginx;
    # hitting the admin container directly on :3000 hydrates fine.
    location /admin {
        proxy_pass          http://admin:3000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade         $http_upgrade;
        proxy_set_header    Connection      $connection_upgrade;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # WebSocket — long-lived connection, no proxy read timeout
    location /ws/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API — gzip JSON, buffer slow clients
    location / {
        #  These are required — nginx strips these by default
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        proxy_pass          http://api:8000;
        proxy_set_header    Host            $host;
        proxy_read_timeout  135s;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ← tells backend it's HTTPS

        # ← rewrites any http:// redirects from backend to https://
        proxy_redirect http:// https://;

        gzip            on;
        gzip_types      application/json text/plain;
        gzip_min_length 256;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}
