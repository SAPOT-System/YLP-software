# nginx reverse proxy for the Dockerized YLP / SAPOT server.
# Docker-flavored copy of nginx.conf: proxies to the `api` service by
# Docker DNS name instead of 127.0.0.1, and reads certs from the shared
# `certs` volume mounted into this container. The host nginx.conf (used
# for bare-metal deploys) is untouched — update both if the proxy rules
# change.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve profile pictures directly — never touches Python workers
    location /static/ {
        alias /usr/share/nginx/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Tileserver — reverse-proxied so tile requests share the API's TLS
    # cert/pinning instead of exposing tileserver-gl's own port 8080.
    # Trailing slash on proxy_pass strips the /tiles/ prefix.
    location /tiles/ {
        proxy_pass          http://tileserver:8080/;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

        gzip            on;
        gzip_types      application/json;
        gzip_min_length 256;
    }

    # WebSocket — long-lived connection, no proxy read timeout
    location /ws/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API — gzip JSON, buffer slow clients
    location / {
        #  These are required — nginx strips these by default
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header  Authorization;

        proxy_pass          http://api:8000;
        proxy_set_header    Host            $host;
        proxy_read_timeout  135s;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # ← tells backend it's HTTPS

        # ← rewrites any http:// redirects from backend to https://
        proxy_redirect http:// https://;

        gzip            on;
        gzip_types      application/json text/plain;
        gzip_min_length 256;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host$request_uri;
}
